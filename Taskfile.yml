version: '3'

dotenv: ['.env']

includes:
  podman:
    taskfile: ./deploy/podman/Taskfile.yml
    dir: ./deploy/podman
    aliases: [pd]
    vars:
      DEV_INPUT: '{{.DEV | default ""}}'
  kubernetes:
    taskfile: ./deploy/kubernetes/Taskfile.yml
    dir: ./deploy/kubernetes
    aliases: [k8s]
  keycloak:
    taskfile: ./deploy/keycloak/Taskfile.yml
    dir: ./deploy/keycloak
    aliases: [kc]
  minio-nx-cache:
    taskfile: ./deploy/minio-nx-cache/Taskfile.yml
    dir: ./deploy/minio-nx-cache
    aliases: [minio]

vars:
  IMAGE_TAG: '{{.IMAGE_TAG | default "latest"}}'
  DEV_REGISTRY: '{{.DEV_REGISTRY | default ""}}'

tasks:
  default:
    silent: true
    cmds:
      - task --list

  build:all:
    desc: Build all binaries
    deps: [build:server, build:cli]

  build:server:
    desc: Build the server binary
    dir: server
    cmds:
      - go build -o ../bin/fleetshift ./cmd/fleetshift

  build:cli:
    desc: Build the fleetctl CLI binary
    dir: cli
    cmds:
      - go build -o ../bin/fleetctl ./cmd/fleetctl

  test:all:
    desc: Run unit tests for all modules
    deps: [test:server, test:cli, test:server-integration, test:deploy]

  test:deploy:
    desc: Run AIO packaging unit tests
    dir: deploy/aio
    cmds:
      - go test -count=1 ./...

  test:server:
    desc: Run server tests
    dir: server
    cmds:
      - go test -count=1 ./...

  test:cli:
    desc: Run CLI tests
    dir: cli
    cmds:
      - go test -count=1 ./...

  test:server-integration:
    desc: Docker-heavy integration tests (requires container runtime; fails if missing)
    dir: server
    cmds:
      - go test -tags integration -count=1 -timeout 15m ./internal/addon/kind/
      - go test -tags integration -count=1 -timeout 15m ./internal/addon/kubernetes/
      - go test -race -count=1 ./internal/addon/kubernetes/

  test:stress:
    desc: "Stress test orchestration loop (env: STRESS_RATE, STRESS_DURATION, STRESS_DEPLOYMENTS, STRESS_ACK_DELAY_MIN/MAX, STRESS_COMPLETION_DELAY_MIN/MAX, STRESS_FAILURE_RATE, STRESS_POSTGRES_MAX_CONNS, STRESS_WORKFLOW_POLLERS)"
    dir: fleetshift-server
    cmds:
      # Needed only on Linux hosts using rootless Podman; silently fails elsewhere.
      - cmd: systemctl --user restart podman.socket 2>/dev/null || true
        silent: true
      - go test -tags stress -count=1 -run TestStress -v -timeout 0 ./internal/application/

  protogen:
    desc: Generate protobuf and gRPC code (skips if unchanged)
    preconditions:
      - sh: command -v buf
        msg: "buf is not installed. See https://buf.build/docs/installation"
    sources: ['proto/**/*.proto', buf.yaml, buf.gen.yaml]
    cmds:
      - buf generate --path proto/fleetshift

  image:build:
    desc: Build fleetshift container images (server, server-local, web)
    cmds:
      - >-
        podman build
        -t fleetshift-server:{{.IMAGE_TAG}}
        -t quay.io/stolostron/fleetshift-server:{{.IMAGE_TAG}}
        {{if .DEV_REGISTRY}}-t {{.DEV_REGISTRY}}/fleetshift-server:{{.IMAGE_TAG}}{{end}}
        .
      - >-
        podman build -f Dockerfile.local
        -t fleetshift-server-local:{{.IMAGE_TAG}}
        -t quay.io/stolostron/fleetshift-server-local:{{.IMAGE_TAG}}
        {{if .DEV_REGISTRY}}-t {{.DEV_REGISTRY}}/fleetshift-server-local:{{.IMAGE_TAG}}{{end}}
        .
      - >-
        podman build -f Dockerfile.web
        -t fleetshift-web:{{.IMAGE_TAG}}
        -t quay.io/stolostron/fleetshift-web:{{.IMAGE_TAG}}
        {{if .DEV_REGISTRY}}-t {{.DEV_REGISTRY}}/fleetshift-web:{{.IMAGE_TAG}}{{end}}
        .

  # Use localhost/ (not short names): Fedora/RHEL Podman prompts to pick a
  # registry for unqualified FROM names. --pull=missing still fetches Dex.
  image:aio:
    desc: Build all-in-one image from locally built server-local + web
    deps: [image:build]
    cmds:
      - >-
        podman build {{.CLI_ARGS}} --pull=missing -f Dockerfile.fleetshift
        --build-arg SERVER_IMAGE=localhost/fleetshift-server-local:{{.IMAGE_TAG}}
        --build-arg WEB_IMAGE=localhost/fleetshift-web:{{.IMAGE_TAG}}
        -t quay.io/stolostron/fleetshift:{{.IMAGE_TAG}}
        {{if .DEV_REGISTRY}}-t {{.DEV_REGISTRY}}/fleetshift:{{.IMAGE_TAG}}{{end}}
        .

  image:push:
    desc: Push images to DEV_REGISTRY (never pushes to stolostron)
    preconditions:
      - sh: test -n "{{.DEV_REGISTRY}}"
        msg: "DEV_REGISTRY is not set. Push only targets your personal dev registry."
    cmds:
      - podman push {{.DEV_REGISTRY}}/fleetshift-server:{{.IMAGE_TAG}}
      - podman push {{.DEV_REGISTRY}}/fleetshift-server-local:{{.IMAGE_TAG}}
      - podman push {{.DEV_REGISTRY}}/fleetshift-web:{{.IMAGE_TAG}}
