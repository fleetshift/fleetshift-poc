syntax = "proto3";

package ocm.resource_manager.v1alpha;

option go_package = "github.com/stolostron/ocm-resource-manager/server/gen/ocm/resource_manager/v1alpha;rmv1alpha";

import "google/api/field_behavior.proto";

// TargetSelector selects targets by label matching.
message TargetSelector {
  // Labels that must all match for a target to be selected.
  map<string, string> match_labels = 1 [(google.api.field_behavior) = REQUIRED];
}
