syntax = "proto3";

package ocm.resource_manager.v1alpha;

option go_package = "github.com/stolostron/ocm-resource-manager/server/gen/ocm/resource_manager/v1alpha;rmv1alpha";

import "google/api/field_behavior.proto";

// RemoveRequest instructs the fleetlet to remove a delivery from a target.
message RemoveRequest {
  string delivery_id = 1 [(google.api.field_behavior) = REQUIRED];

  string deployment_id = 2 [(google.api.field_behavior) = REQUIRED];

  string target_id = 3 [(google.api.field_behavior) = REQUIRED];
}
