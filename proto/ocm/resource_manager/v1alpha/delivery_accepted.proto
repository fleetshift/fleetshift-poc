syntax = "proto3";

package ocm.resource_manager.v1alpha;

option go_package = "github.com/stolostron/ocm-resource-manager/server/gen/ocm/resource_manager/v1alpha;rmv1alpha";

// DeliveryAccepted acknowledges that the agent received a
// [DeliveryRequest] and will begin applying manifests.
message DeliveryAccepted {
  string delivery_id = 1;
}
