syntax = "proto3";

package ocm.resource_manager.v1alpha;

option go_package = "github.com/stolostron/ocm-resource-manager/server/gen/ocm/resource_manager/v1alpha;rmv1alpha";

import "google/api/annotations.proto";
import "google/api/client.proto";
import "ocm/resource_manager/v1alpha/signer_enrollment.proto";
import "ocm/resource_manager/v1alpha/create_signer_enrollment_request.proto";

// SignerEnrollmentService manages user signer enrollments.
service SignerEnrollmentService {
  // CreateSignerEnrollment enrolls a signer by verifying the ID token
  // and deriving the registry subject via CEL claim mapping.
  rpc CreateSignerEnrollment(CreateSignerEnrollmentRequest) returns (SignerEnrollment) {
    option (google.api.http) = {
      post: "/v1alpha/signerEnrollments"
      body: "*"
    };
    option (google.api.method_signature) = "signer_enrollment_id,identity_token";
  }
}
