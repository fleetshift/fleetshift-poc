syntax = "proto3";

package ocm.resource_manager.v1alpha;

option go_package = "github.com/stolostron/ocm-resource-manager/server/gen/ocm/resource_manager/v1alpha;rmv1alpha";

import "ocm/resource_manager/v1alpha/target_accepted.proto";
import "ocm/resource_manager/v1alpha/fleetlet_error.proto";

// ControlInstruction is the envelope for platform-to-fleetlet messages
// on the control channel.
message ControlInstruction {
  oneof instruction {
    TargetAccepted target_accepted = 1;
    FleetletError error = 2;
  }
}
