syntax = "proto3";

package ocm.resource_manager.v1alpha;

option go_package = "github.com/stolostron/ocm-resource-manager/server/gen/ocm/resource_manager/v1alpha;rmv1alpha";

import "ocm/resource_manager/v1alpha/resource_result.proto";

// Response message for
// [ResourceQueryService.QueryResources][ocm.resource_manager.v1alpha.ResourceQueryService.QueryResources].
message QueryResourcesResponse {
  // The resources matching the query, in the applied order.
  repeated ResourceResult resources = 1;

  // A token for the next page. If empty, there are no more results.
  string next_page_token = 2;
}
