syntax = "proto3";

package ocm.resource_manager.v1alpha;

option go_package = "github.com/stolostron/ocm-resource-manager/server/gen/ocm/resource_manager/v1alpha;rmv1alpha";

// TargetAccepted confirms that the platform has registered the target.
message TargetAccepted {
  // The target identifier that was registered.
  string target_id = 1;
}
