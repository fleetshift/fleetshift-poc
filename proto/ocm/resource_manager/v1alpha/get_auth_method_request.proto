syntax = "proto3";

package ocm.resource_manager.v1alpha;

option go_package = "github.com/stolostron/ocm-resource-manager/server/gen/ocm/resource_manager/v1alpha;rmv1alpha";

import "google/api/field_behavior.proto";
import "google/api/resource.proto";

// Request message for
// [AuthMethodService.GetAuthMethod][ocm.resource_manager.v1alpha.AuthMethodService.GetAuthMethod].
message GetAuthMethodRequest {
  // The resource name of the auth method to retrieve.
  // Format: authMethods/{auth_method}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "resource-manager.open-cluster-management.io/AuthMethod"
    }
  ];
}
