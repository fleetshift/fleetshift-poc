syntax = "proto3";

package ocm.v1alpha;

option go_package = "github.com/stolostron/ocm-resource-manager/server/gen/ocm/v1alpha;ocmv1alpha";

import "ocm/v1alpha/register_target.proto";

// ControlEvent is the envelope for fleetlet-to-platform messages on
// the control channel.
message ControlEvent {
  oneof event {
    RegisterTarget register_target = 1;
  }
}
