syntax = "proto3";

package ocm.v1alpha;

option go_package = "github.com/stolostron/ocm-fleet/server/gen/ocm/v1alpha;ocmv1alpha";

import "google/api/annotations.proto";
import "google/api/client.proto";
import "ocm/v1alpha/auth_method.proto";
import "ocm/v1alpha/create_auth_method_request.proto";
import "ocm/v1alpha/get_auth_method_request.proto";

// AuthMethodService manages authentication methods.
service AuthMethodService {
  // CreateAuthMethod creates a new authentication method.
  rpc CreateAuthMethod(CreateAuthMethodRequest) returns (AuthMethod) {
    option (google.api.http) = {
      post: "/v1alpha/authMethods"
      body: "auth_method"
    };
    option (google.api.method_signature) = "auth_method,auth_method_id";
  }

  // GetAuthMethod retrieves an authentication method by resource name.
  rpc GetAuthMethod(GetAuthMethodRequest) returns (AuthMethod) {
    option (google.api.http) = {
      get: "/v1alpha/{name=authMethods/*}"
    };
    option (google.api.method_signature) = "name";
  }
}
