syntax = "proto3";

package ocm.v1alpha;

option go_package = "github.com/stolostron/ocm-resource-manager/server/gen/ocm/v1alpha;ocmv1alpha";

import "google/api/field_behavior.proto";
import "google/api/resource.proto";

// Request message for
// [DeploymentService.GetDeployment][ocm.v1alpha.DeploymentService.GetDeployment].
message GetDeploymentRequest {
  // The resource name of the deployment to retrieve.
  // Format: deployments/{deployment}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {
      type: "open-cluster-management.io/Deployment"
    }
  ];
}
