syntax = "proto3";

package ocm.v1alpha;

option go_package = "github.com/stolostron/ocm-resource-manager/server/gen/ocm/v1alpha;ocmv1alpha";

import "google/api/field_behavior.proto";

// ProvisionedTarget declares a target that a delivery created and that
// the platform should register. Properties should include vault refs
// for any associated secrets (e.g. "kubeconfig_ref").
message ProvisionedTarget {
  string target_id = 1 [(google.api.field_behavior) = REQUIRED];

  string target_type = 2 [(google.api.field_behavior) = REQUIRED];

  string name = 3 [(google.api.field_behavior) = REQUIRED];

  map<string, string> labels = 4;

  map<string, string> properties = 5;

  repeated string accepted_manifest_types = 6;
}
