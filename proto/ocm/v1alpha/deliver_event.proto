syntax = "proto3";

package ocm.v1alpha;

option go_package = "github.com/stolostron/ocm-resource-manager/server/gen/ocm/v1alpha;ocmv1alpha";

import "ocm/v1alpha/delivery_accepted.proto";
import "ocm/v1alpha/delivery_progress.proto";
import "ocm/v1alpha/delivery_completed.proto";
import "ocm/v1alpha/remove_completed.proto";
import "ocm/v1alpha/delivery_condition_report.proto";

// DeliverEvent is the envelope for fleetlet-to-platform messages on
// the delivery channel.
message DeliverEvent {
  oneof event {
    DeliveryAccepted delivery_accepted = 1;
    DeliveryProgress delivery_progress = 2;
    DeliveryCompleted delivery_completed = 3;
    RemoveCompleted remove_completed = 4;
    DeliveryConditionReport condition_report = 5;
  }
}
