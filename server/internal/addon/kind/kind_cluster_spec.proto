syntax = "proto3";

package ocm.resource_manager.kind.v1alpha;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";

// KindClusterSpec defines the desired state of a kind cluster. This is
// the canonical spec used by both the managed resource API and the
// delivery agent.
message KindClusterSpec {
  // Name of the kind cluster. Only used for direct, non-managed
  // deliveries (an inline manifest on a deployment), where there is
  // no other identity to draw a cluster name from. For managed
  // resources, the cluster name always comes from the resource's own
  // name instead, and this field is ignored -- so it must not be
  // required here.
  string name = 1 [(google.api.field_behavior) = OPTIONAL];

  // Nodes to provision. Defaults to a single control-plane node when
  // empty.
  repeated NodeSpec nodes = 2 [(google.api.field_behavior) = OPTIONAL];

  // Networking configuration. Omit for kind defaults.
  Networking networking = 3 [(google.api.field_behavior) = OPTIONAL];

  // OIDC configures the API server's OpenID Connect authentication.
  OIDC oidc = 4 [(google.api.field_behavior) = OPTIONAL];
}

// NodeSpec describes a node in the kind cluster.
message NodeSpec {
  // Role must be "control-plane" or "worker".
  string role = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (buf.validate.field).string = {in: ["control-plane", "worker"]}
  ];

  // Image is the node image (e.g. "kindest/node:v1.31.0"). When
  // empty, kind uses its default image for the installed version.
  string image = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Networking holds cluster networking settings.
message Networking {
  // API server port on the host. Zero means kind picks an available
  // port.
  int32 api_server_port = 1 [(google.api.field_behavior) = OPTIONAL];

  // Pod CIDR (e.g. "10.244.0.0/16"). Empty uses kind's default.
  string pod_subnet = 2 [(google.api.field_behavior) = OPTIONAL];

  // Service CIDR (e.g. "10.96.0.0/16"). Empty uses kind's default.
  string service_subnet = 3 [(google.api.field_behavior) = OPTIONAL];
}

// OIDC configures API server OpenID Connect authentication.
message OIDC {
  // Claim used as the username. Defaults to "sub" when empty.
  string username_claim = 1 [(google.api.field_behavior) = OPTIONAL];

  // Claim used for group membership. Defaults to "groups" when empty.
  string groups_claim = 2 [(google.api.field_behavior) = OPTIONAL];
}
