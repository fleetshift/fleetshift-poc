version: '3'

vars:
  KC_CLUSTER_CHECK: '[ -n "${KC_CLUSTER_API}" ] && oc whoami --show-server 2>/dev/null | grep -qF "${KC_CLUSTER_API}"'
  KC_CLUSTER_MSG: "Wrong cluster or KC_CLUSTER_API not set. This task requires the Keycloak OCP cluster. Set KC_CLUSTER_API in .env and run: oc login ${KC_CLUSTER_API:-<keycloak-cluster-url>}"

tasks:
  deploy:
    desc: Deploy MinIO Nx remote cache to OpenShift
    preconditions:
      - sh: '{{.KC_CLUSTER_CHECK}}'
        msg: '{{.KC_CLUSTER_MSG}}'
    cmds:
      - ./scripts/deploy.sh

  teardown:
    desc: Tear down MinIO Nx cache deployment from OpenShift (interactive)
    interactive: true
    preconditions:
      - sh: '{{.KC_CLUSTER_CHECK}}'
        msg: '{{.KC_CLUSTER_MSG}}'
    cmds:
      - ./scripts/teardown.sh

  status:
    desc: Show pods, services, and routes in the minio-nx-cache namespace
    preconditions:
      - sh: '{{.KC_CLUSTER_CHECK}}'
        msg: '{{.KC_CLUSTER_MSG}}'
    cmds:
      - oc get all -n minio-nx-cache

  credentials:
    desc: Print MinIO credentials and Nx cache connection info
    preconditions:
      - sh: '{{.KC_CLUSTER_CHECK}}'
        msg: '{{.KC_CLUSTER_MSG}}'
    cmds:
      - |
        API_ROUTE=$(oc get route minio-api -n minio-nx-cache -o jsonpath='{.spec.host}')
        ROOT_USER=$(oc get secret minio-credentials -n minio-nx-cache -o jsonpath='{.data.MINIO_ROOT_USER}' | base64 -d)
        ROOT_PASSWORD=$(oc get secret minio-credentials -n minio-nx-cache -o jsonpath='{.data.MINIO_ROOT_PASSWORD}' | base64 -d)
        echo ""
        echo "  S3 API:   https://${API_ROUTE}"
        echo "  Bucket:   nx-cache"
        echo ""
        echo "  Credentials:"
        echo "    Root User:     ${ROOT_USER}"
        echo "    Root Password: ${ROOT_PASSWORD}"
        echo ""
