# Trusted TLS certificate for the nx-cache-proxy Route, issued by cert-manager.
#
# The proxy is consumed by the Nx CLI, whose HTTP client rejects the cluster's
# default self-signed ingress cert ("Failed to send request"). This requests a
# publicly-trusted cert so NX_SELF_HOSTED_REMOTE_CACHE_SERVER=https://<route>
# works with no local CA trust or TLS-skip flags, from both dev machines and CI.
#
# deploy.sh substitutes __PROXY_HOST__ (the Route host, cluster-specific) and
# __CERT_ISSUER__ (ClusterIssuer name, default `zerossl-prod`) before applying,
# then copies the resulting secret into the Route's edge TLS config.
#
# NOTE: without the cert-manager openshift-routes controller the Route is not
# auto-updated on renewal — re-run deploy.sh to re-patch, or install that
# controller for hands-off renewal.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nx-cache-proxy-tls
spec:
  secretName: nx-cache-proxy-tls
  dnsNames:
    - __PROXY_HOST__
  issuerRef:
    name: __CERT_ISSUER__
    kind: ClusterIssuer
