apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  labels:
    app: minio
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: minio-bucket-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
          command: ["/bin/sh", "-c"]
          args:
            - |
              until mc --config-dir /tmp/mc alias set myminio http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "Waiting for MinIO..."
                sleep 2
              done
              mc --config-dir /tmp/mc mb --ignore-existing myminio/nx-cache
              mc --config-dir /tmp/mc ilm rule add --expire-days 3 myminio/nx-cache
              echo "Bucket 'nx-cache' ready (lifecycle: expire after 3 days)."
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          envFrom:
            - secretRef:
                name: minio-credentials
          volumeMounts:
            - name: mc-config
              mountPath: /tmp/mc
      volumes:
        - name: mc-config
          emptyDir: {}
