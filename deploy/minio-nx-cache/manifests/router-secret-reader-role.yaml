# Lets the OpenShift ingress router read the proxy's TLS Secret so the Route can
# reference it via spec.tls.externalCertificate. Scoped to just this one Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nx-cache-proxy-cert-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["nx-cache-proxy-tls"]
    verbs: ["get", "list", "watch"]
