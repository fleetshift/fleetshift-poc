apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: ocm-fleet-server
spec:
  tags:
    - name: latest
      from:
        kind: DockerImage
        name: quay.io/stolostron/ocm-fleet-server:latest
      importPolicy:
        scheduled: true
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: ocm-fleet-web
spec:
  tags:
    - name: latest
      from:
        kind: DockerImage
        name: quay.io/stolostron/ocm-fleet-web:latest
      importPolicy:
        scheduled: true
