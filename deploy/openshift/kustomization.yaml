apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ocm-fleet
resources:
  - namespace.yaml
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - postgres/pvc.yaml
  - resource-manager/deployment.yaml
  - resource-manager/service.yaml
  - resource-manager/route-http.yaml
  - resource-manager/route-grpc.yaml
  - resource-manager/imagestreams.yaml
configMapGenerator:
  - name: resource-manager-config
    envs:
      - config.env
secretGenerator:
  - name: postgres-credentials
    envs:
      - secrets.env
    type: Opaque
generatorOptions:
  disableNameSuffixHash: true
