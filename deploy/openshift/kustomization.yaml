apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ocm-resource-manager
resources:
  - namespace.yaml
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - postgres/pvc.yaml
  - ocm-resource-manager-server/deployment.yaml
  - ocm-resource-manager-server/service.yaml
  - ocm-resource-manager-server/route-http.yaml
  - ocm-resource-manager-server/route-grpc.yaml
  - ocm-resource-manager-server/imagestreams.yaml
configMapGenerator:
  - name: ocm-resource-manager-server-config
    envs:
      - config.env
secretGenerator:
  - name: postgres-credentials
    envs:
      - secrets.env
    type: Opaque
generatorOptions:
  disableNameSuffixHash: true
