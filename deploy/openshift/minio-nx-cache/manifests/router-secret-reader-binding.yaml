# Binds the router serviceaccount (in openshift-ingress) to the Secret-reader
# Role in this namespace, so the router can serve the externalCertificate.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nx-cache-proxy-cert-reader
subjects:
  - kind: ServiceAccount
    name: router
    namespace: openshift-ingress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nx-cache-proxy-cert-reader
