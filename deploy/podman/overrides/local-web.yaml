# Bind host web/ over the AIO baked UI. Layered by LOCAL_WEB=true.
# !override replaces the whole volumes list, so every base mount is restated.

services:

  ocm-resource-manager-server:
    volumes: !override
      - ${PODMAN_SOCKET}:/var/run/docker.sock
      - /tmp:/tmp
      - ocm-resource-manager-data:/data
      - ../../web:/srv/web:ro,z
