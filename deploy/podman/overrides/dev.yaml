# Dev override — build the UI from source.
#
# Layered by DEV=true (task podman:dev). The all-in-one server image is built
# from source by scripts/start.sh via `task image:aio`; here we only switch the
# web-builder to build the UI from source so the served assets are fresh.

services:

  # ── Frontend builder — build from source instead of the prebuilt image ──

  web-builder:
    build:
      context: ../..
      dockerfile: Dockerfile.web
      args:
        NX_SELF_HOSTED_REMOTE_CACHE_SERVER: "${NX_SELF_HOSTED_REMOTE_CACHE_SERVER:-}"
        NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: "${NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN:-}"
    privileged: true
