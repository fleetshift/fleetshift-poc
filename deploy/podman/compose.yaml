# FleetShift deployment — composable via override files.
#
# Runs the all-in-one image (deploy/aio): a single container with the
# FleetShift API, baked-in UI, and peer Dex under s6. Packaging owns PID 1,
# the `fleetshift serve` argv, sandbox PKI, and Dex — the compose layer only
# supplies env (the root .env), ports, volumes, and the host container socket.
#
# Auth is chosen inside the container by OIDC_ISSUER_URL (read from .env):
#   unset  → peer Dex (built-in sandbox IdP at https://127.0.0.1:5556/dex)
#   set    → that external issuer; peer Dex parks on s6-pause and never serves
#
# Usage (via Taskfile):
#   task podman:up            — sqlite + built-in Dex (or external if set)
#   task podman:dev           — build the AIO image from source, then up
#
# Override files are in deploy/podman/overrides/ and layered by scripts/common.sh.
# Do not use `podman compose` directly — use `task podman:*` targets instead.
#
# Note: the AIO image is sqlite-only. There is no postgres backend here.

# ── Shared fleetshift-server config ──────────────────────────────────
x-fleetshift-server: &fleetshift-server
  # Defaults to the all-in-one image. `task podman:dev` builds it locally as
  # quay.io/stolostron/fleetshift:latest via the root `image:aio` target.
  image: ${FLEETSHIFT_SERVER_IMAGE:-quay.io/stolostron/fleetshift:latest}
  restart: unless-stopped
  privileged: true
  # s6 starts as container root to init and drop privileges (fleetshift 1000,
  # dex 1001). Must run as root.
  user: "0:0"
  # Ingest the whole root .env. aio-init reads what it needs (OIDC_*, GCPHCP_*,
  # FLEETSHIFT_*) and ignores the rest; unset OIDC_ISSUER_URL selects peer Dex.
  env_file:
    - ../../.env
  ports:
    - "${FLEETSHIFT_SERVER_HTTP_PORT:-8085}:8085"
    - "${FLEETSHIFT_SERVER_GRPC_PORT:-50051}:50051"
    # Peer Dex. Idle when an external issuer is configured (Dex parks); the
    # container never serves on it, so a bound-but-unused port is harmless.
    - "5556:5556"
  volumes:
    - ${PODMAN_SOCKET}:/var/run/docker.sock
    - /tmp:/tmp
    # sqlite db + sandbox PKI live under /data.
    - fleetshift-data:/data
    # Baked-in UI is shadowed by freshly built assets from web-builder.
    - web-assets:/srv/web:ro
  networks:
    - default
    - kind

services:

  # ── Frontend assets (init container) ────────────────────────────

  web-builder:
    image: ${FLEETSHIFT_WEB_IMAGE:-quay.io/stolostron/fleetshift-web:latest}
    volumes:
      - web-assets:/output

  # ── Core (all-in-one: API + UI + peer Dex) ──────────────────────

  fleetshift-server:
    <<: *fleetshift-server
    # No command: s6 (PID 1) owns Dex and the fleetshift serve argv, which
    # aio-init builds from the OIDC_* env above.
    depends_on:
      web-builder:
        condition: service_completed_successfully

volumes:
  web-assets:
  fleetshift-data:

networks:
  default:
    name: fleetshift
  kind:
    name: kind
    external: true
