# AIO image via compose. Public origin:
#   https://fleetshift-sandbox.localhost:8085  (TLS edge; Dex under /idp)
# Published: 127.0.0.1:8085 (HTTPS), 127.0.0.1:50051 (gRPC).
# OIDC_ISSUER_URL unset → peer Dex; set → that issuer (Dex parks).
# sqlite only. Use task podman:* — not podman compose directly.
# If /data still has issuer https://127.0.0.1:5556/dex, run task pd:clean.

x-fleetshift-aio: &fleetshift-aio
  image: ${FLEETSHIFT_SERVER_IMAGE:-quay.io/stolostron/fleetshift:latest}
  restart: unless-stopped
  privileged: true
  # s6 starts as root, then drops to fleetshift 1000 / dex 1001 / aio-proxy 1002.
  user: "0:0"
  # aio-init reads OIDC_*, GCPHCP_*, FLEETSHIFT_* and ignores the rest.
  env_file:
    - ../../.env
  ports:
    - "127.0.0.1:${FLEETSHIFT_SERVER_HTTP_PORT:-8085}:8085"
    - "127.0.0.1:${FLEETSHIFT_SERVER_GRPC_PORT:-50051}:50051"
  volumes:
    - ${PODMAN_SOCKET}:/var/run/docker.sock
    - /tmp:/tmp
    - fleetshift-data:/data
  networks:
    default: {}
    kind:
      aliases:
        - fleetshift

services:

  # Compose service name for the AIO container (proxy + API + UI + Dex).
  fleetshift-server:
    <<: *fleetshift-aio
    # No command: s6 is PID 1.

volumes:
  fleetshift-data:

networks:
  default:
    name: fleetshift
  kind:
    name: kind
    external: true
