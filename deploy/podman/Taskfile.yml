version: '3'

# FleetShift podman stack. Runs the all-in-one image (deploy/aio): API + UI +
# peer Dex in one container. Auth is chosen inside the container from the root
# .env — set OIDC_ISSUER_URL for an external issuer, leave it unset for the
# built-in Dex sandbox IdP. sqlite only (the AIO image has no postgres backend).

vars:
  ACTIVE_DEV:
    sh: 'grep "^DEV=" .active-deploy 2>/dev/null | cut -d= -f2 || true'
  DEV: '{{if not (empty .DEV_INPUT)}}{{.DEV_INPUT}}{{else if not (empty .ACTIVE_DEV)}}{{.ACTIVE_DEV}}{{else}}false{{end}}'
  LOCAL_WEB: '{{.LOCAL_WEB | default "false"}}'
  NX_CACHE: '{{.NX_CACHE | default "false"}}'
  BUILD: '{{.BUILD | default "false"}}'
  RESOLVED_COMPOSE_FILES: '-f compose.yaml{{if eq .DEV "true"}} -f overrides/dev.yaml{{end}}{{if eq .LOCAL_WEB "true"}} -f overrides/local-web.yaml{{end}}{{if eq .NX_CACHE "true"}} -f overrides/nx-cache.yaml{{end}}'
  RESOLVED_PODMAN_SOCKET:
    sh: './scripts/detect-podman-socket.sh'

tasks:
  ensure-podman:
    internal: true
    cmds:
      - bash -c 'source ./scripts/common.sh && ensure_podman_ready'
    preconditions:
      - sh: command -v podman
        msg: "podman is not installed."
      - sh: command -v docker-compose
        msg: "docker-compose is not installed. Install: brew install docker-compose (podman-compose is not compatible)"

  up:
    desc: Start the FleetShift stack (built-in Dex unless OIDC_ISSUER_URL is set)
    deps: [ensure-podman]
    env: &deploy_env
      COMPOSE_FILES: '{{.RESOLVED_COMPOSE_FILES}}'
      DEV: '{{.DEV}}'
      BUILD: '{{.BUILD}}'
      PODMAN_SOCKET: '{{.RESOLVED_PODMAN_SOCKET}}'
    preconditions:
      - sh: test -f {{.ROOT_DIR}}/.env
        msg: "No .env found. Copy .env.template to .env first."
    cmds:
      - ./scripts/start.sh
      - printf 'DEV={{.DEV}}\n' > .active-deploy

  dev:
    desc: Start in dev mode — builds the all-in-one image from source, then up
    cmds:
      - task: up
        vars:
          DEV: "true"

  build:
    desc: Build the all-in-one image from source (server + UI + peer Dex)
    dir: '{{.ROOT_DIR}}'
    cmds:
      - task image:aio

  rebuild:
    desc: Stop, rebuild the image from source, and restart
    cmds:
      - ./scripts/stop.sh
      - task: up
        vars:
          DEV: '{{.DEV}}'
          BUILD: "true"

  pull:
    desc: Pull the latest all-in-one + web images
    env: *deploy_env
    cmds:
      - podman compose $COMPOSE_FILES --env-file {{.ROOT_DIR}}/.env pull --ignore-buildable

  down:
    desc: Stop all containers, preserve data
    cmds:
      - ./scripts/stop.sh
      - rm -f .active-deploy

  clean:
    desc: Stop all containers and remove all data (volumes, network)
    cmds:
      - ./scripts/stop.sh --clean
      - rm -f .active-deploy

  logs:
    desc: Tail logs from all FleetShift containers
    env: *deploy_env
    cmds:
      - podman compose $COMPOSE_FILES --env-file {{.ROOT_DIR}}/.env logs -f

  'logs:*':
    desc: "Tail logs from a specific container (e.g. task podman:logs:fleetshift-server)"
    env: *deploy_env
    vars:
      CONTAINER: '{{index .MATCH 0}}'
    cmds:
      - podman compose $COMPOSE_FILES --env-file {{.ROOT_DIR}}/.env logs -f {{.CONTAINER}}

  status:
    desc: Show running FleetShift containers
    env: *deploy_env
    cmds:
      - podman compose $COMPOSE_FILES --env-file {{.ROOT_DIR}}/.env ps

  clock-drift:
    desc: Check Podman machine clock drift from the host
    cmds:
      - ./scripts/check-clock-drift.sh {{.CLI_ARGS}}

  'restart:*':
    desc: "Restart a specific container (e.g. task podman:restart:fleetshift-server)"
    env: *deploy_env
    vars:
      CONTAINER: '{{index .MATCH 0}}'
    cmds:
      - podman compose $COMPOSE_FILES --env-file {{.ROOT_DIR}}/.env restart {{.CONTAINER}}

  rebuild-web:
    desc: Rebuild the AIO image (baked UI) and restart the stack
    cmds:
      - task: rebuild
        vars:
          BUILD: "true"

  test-attestation:
    desc: Run the end-to-end attestation flow
    env: *deploy_env
    cmds:
      - ./scripts/test-attestation.sh {{.CLI_ARGS}}
