name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Single cache writer. Test jobs restore the same multi-image tar and do
  # not race this key. Kind host setup stays in the UI job until the end of Stage 2.
  aio-image:
    name: AIO image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up E2E
        uses: ./.github/actions/setup-e2e
        with:
          aio-mode: build

  e2e-ui:
    name: E2E (UI)
    needs: [aio-image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up E2E
        uses: ./.github/actions/setup-e2e
        with:
          aio-mode: load

      # Start the rootless podman API service so the in-container server can
      # drive Kind through the mounted socket (docker-out-of-docker). The kind
      # provider inside the container is podman-remote (CONTAINER_HOST points at
      # the mounted socket), so this host-side API service is what it dials.
      #
      # Bind an explicit path (do not trust RemoteSocket.Path / XDG_RUNTIME_DIR),
      # detach with setsid so it survives past this step, and verify it actually
      # answers before continuing — a dead/unbound service surfaces later as an
      # opaque `podman ps ... exit status 125` from inside the container.
      - name: Start podman API service
        run: |
          sock=/tmp/podman-fleetshift.sock
          setsid podman system service --time=0 "unix://${sock}" >/tmp/podman-service.log 2>&1 &
          for i in $(seq 1 15); do
            if [ -S "$sock" ] && podman --url "unix://${sock}" info >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          podman --url "unix://${sock}" version
          # The service binds the socket 0600 root:root. The in-container server
          # runs as uid 1000 (s6 drops privileges), so without this it gets
          # permission denied → the kind addon's `podman ps` fails with exit 125.
          # 0666 is fine on an ephemeral CI runner.
          sudo chmod 0666 "$sock"
          echo "PODMAN_SOCKET=${sock}" >> "$GITHUB_ENV"
          echo "podman API service listening at ${sock}"

      - name: Prepare container environment
        run: |
          podman network exists kind || podman network create kind
          touch .env

      # Run the single AIO container (API + baked-in UI + peer Dex sandbox).
      # Empty .env => built-in Dex with the ops@/dev@ personas the tests use.
      # Only 8085 is published: the browser reaches Dex under /idp through the
      # HTTPS edge. Dex 5556 and FleetShift HTTP 8086 stay unpublished.
      - name: Run sandbox
        run: |
          echo '127.0.0.1 fleetshift-sandbox.localhost' | sudo tee -a /etc/hosts
          podman run -d --name fleetshift \
            --privileged --user 0:0 \
            --env-file .env \
            --network kind:alias=fleetshift \
            -p 127.0.0.1:8085:8085 \
            -v "${PODMAN_SOCKET}:/var/run/docker.sock" \
            -v /tmp:/tmp \
            quay.io/stolostron/fleetshift:latest

      - name: Wait for sandbox to be ready
        run: |
          echo "Waiting for HTTPS origin to be ready..."
          # aio-proxy Host-allowlists fleetshift-sandbox.localhost (421 otherwise).
          # -k is readiness-only; Playwright uses ignoreHTTPSErrors for the private CA.
          for i in $(seq 1 60); do
            if curl -skf --resolve fleetshift-sandbox.localhost:8085:127.0.0.1 \
              https://fleetshift-sandbox.localhost:8085/readyz >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -skf --resolve fleetshift-sandbox.localhost:8085:127.0.0.1 \
            https://fleetshift-sandbox.localhost:8085/readyz
          if podman port fleetshift | grep -q 5556; then
            echo "Dex port 5556 must not be published" >&2
            podman port fleetshift
            exit 1
          fi
          echo "BASE_URL=https://fleetshift-sandbox.localhost:8085" >> "$GITHUB_ENV"

      # Prove the in-container kind engine path works before the slow lifecycle
      # test spends 5 minutes polling. This is the exact command the kind addon
      # shells out to; if it errors here we see podman's real stderr in seconds
      # instead of an opaque "exit status 125" from the server log.
      # Exec as uid 1000 — the user the server drops to. Running as root would
      # hide the socket-permission problem that actually broke the kind addon.
      - name: Smoke-test in-container kind engine access
        run: |
          podman exec -u 1000 fleetshift sh -lc '
            echo "CONTAINER_HOST=$CONTAINER_HOST"
            ls -l /var/run/docker.sock
            kind version
            podman info --format "{{.Host.RemoteSocket.Path}} exists={{.Host.RemoteSocket.Exists}}"
            podman ps -a --filter label=io.x-k8s.kind.cluster
          '

      - name: Run e2e tests
        run: npx nx test:e2e e2e-web -- --project=chromium

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: |
            e2e/web/test-results/
            e2e/web/playwright-report/
          retention-days: 7

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "===== host podman API service log ====="
          cat /tmp/podman-service.log || true
          echo "===== fleetshift container log ====="
          podman logs fleetshift || true

      - name: Cleanup FleetShift
        if: always()
        run: podman rm -f fleetshift || true

  e2e-backend:
    name: E2E (backend)
    needs: [aio-image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up E2E
        uses: ./.github/actions/setup-e2e
        with:
          aio-mode: warm

      - name: Run backend e2e tests
        working-directory: e2e/backend
        run: go test -tags e2e -count=1 -p 1 -timeout 30m ./...

      - name: Dump leftover containers
        if: failure()
        run: |
          echo "===== podman ps -a ====="
          podman ps -a
          echo "===== labeled AIO logs ====="
          podman ps -a --filter label=fleetshift.e2e=backend --format '{{.ID}}' | while read -r id; do
            echo "----- $id -----"
            podman logs "$id" || true
          done

      - name: Cleanup leftover AIO containers
        if: always()
        run: podman ps -a --filter label=fleetshift.e2e=backend --format '{{.ID}}' | xargs -r podman rm -f
