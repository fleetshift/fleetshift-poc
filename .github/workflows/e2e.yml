name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Single cache writer. Test jobs restore the same multi-image tar and do
  # not race this key. Kind host setup (user podman.socket, kind network) lives
  # in setup-e2e for the Playwright matrix and e2e-backend. They do not share
  # a container.
  aio-image:
    name: AIO image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up E2E
        uses: ./.github/actions/setup-e2e
        with:
          role: cache

  e2e-playwright:
    name: E2E (${{ matrix.name }})
    needs: [aio-image]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: UI
            project: e2e-web
            arguments: "-- --project=chromium"
            artifact_name: e2e-test-results
            artifact_paths: |
              e2e/web/test-results/
              e2e/web/playwright-report/
          - name: CLI
            project: e2e-cli
            arguments: ""
            artifact_name: e2e-cli-test-results
            artifact_paths: e2e/cli/test-results/

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up E2E
        uses: ./.github/actions/setup-e2e
        with:
          role: e2e

      - name: Run ${{ matrix.name }} e2e tests
        env:
          FLEETSHIFT_E2E_AIO_PREBUILT: "1"
          NX_DAEMON: "false"
        run: npx nx test:e2e ${{ matrix.project }} ${{ matrix.arguments }}

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: warn
          retention-days: 7

  e2e-backend:
    name: E2E (backend)
    needs: [aio-image]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    # Unlike the Playwright matrix entries, this job does not start, smoke,
    # dump, or tear down an AIO in the workflow.
    # TestMain / harness.Start runs the container, uid-1000 kind-engine smoke,
    # and Stop(true) dumps logs then removes the AIO and leftover suite Kind
    # nodes. Do not add those as workflow steps: a second AIO fights over
    # 8085/50051 and alias=fleetshift, a dump after Stop sees an empty host,
    # and prefix-wide Kind cleanup can delete another suite's nodes.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up E2E
        uses: ./.github/actions/setup-e2e
        with:
          role: e2e

      - name: Run backend e2e tests
        env:
          GOTESTSUM_FORMAT: github-actions
          NX_DAEMON: "false"
          FLEETSHIFT_E2E_AIO_PREBUILT: "1"
        run: npx nx test:e2e e2e-backend

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-backend-test-results
          path: e2e/backend/tmp/
          if-no-files-found: warn
          retention-days: 7
