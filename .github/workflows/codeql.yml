name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "25 14 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # paths apply to JS/TS only. Go coverage comes from the build step below.
          config: |
            paths:
              - client/web
              - sdk/common
              - sdk/build-utils
              - extensions/core/client
              - extensions/gcphcp/client
              - extensions/kind/client
              - e2e
            paths-ignore:
              - "**/node_modules"
              - "**/dist"
              - poc

      - name: Build all Go modules
        if: matrix.language == 'go'
        run: |
          set -euo pipefail
          while IFS= read -r mod; do
            dir=$(dirname "$mod")
            echo "Building $dir..."
            (cd "$dir" && go build ./...)
          done < <(find . -name go.mod -not -path '*/vendor/*' -not -path './poc/*' | sort)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
