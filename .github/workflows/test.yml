name: Unit/Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TESTCONTAINERS_PROVIDER: docker
  NX_DAEMON: "false"

jobs:
  test-backend:
    name: Test (${{ matrix.project }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOTESTSUM_FORMAT: github-actions

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: server
            go-mod: server
          - project: cli
            go-mod: cli
          - project: deploy-aio
            go-mod: deploy/aio
            # These are e2e backend unit tests only
          - project: e2e-backend
            go-mod: e2e/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.go-mod }}/go.mod
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Detect Docker host address for kind OIDC tests
        if: matrix.project == 'server'
        run: echo "KIND_HOST_ADDR=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: npx nx test ${{ matrix.project }}

      - name: Run integration tests
        if: matrix.project == 'server'
        run: npx nx test-integration server

  test-ui:
    name: UI Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build common library
        run: npx nx run common:build

      - name: Unit tests (vitest)
        run: npx nx run common:test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Component tests (web)
        run: npx nx run web:test:ct

      - name: Component tests (plugins)
        run: npx nx run plugins:test:ct
