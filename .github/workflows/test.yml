name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TESTCONTAINERS_PROVIDER: docker

jobs:
  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        module: [server, cli]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Detect Docker host address for kind OIDC tests
        if: matrix.module == 'server'
        run: echo "KIND_HOST_ADDR=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')" >> "$GITHUB_ENV"

      - name: Run all unit tests
        working-directory: ${{ matrix.module }}
        run: go test -count=1 -timeout 15m ./...

      - name: Run kind docker integration tests
        if: matrix.module == 'server'
        working-directory: ${{ matrix.module }}
        run: go test -tags integration -count=1 -timeout 15m ./internal/addon/kind/

      - name: Run kubernetes docker integration tests
        if: matrix.module == 'server'
        working-directory: ${{ matrix.module }}
        run: go test -tags integration -count=1 -timeout 15m ./internal/addon/kubernetes/

      - name: Run kubernetes race tests
        if: matrix.module == 'server'
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./internal/addon/kubernetes/

  ui-test:
    name: UI Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build common library
        run: npx nx run common:build

      - name: Unit tests (vitest)
        run: npx nx run ui:test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Component tests (gui)
        run: npx nx run gui:test:ct

      - name: Component tests (plugins)
        run: npx nx run plugins:test:ct

  deploy-scripts:
    name: Deploy script contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run deploy contract tests
        run: bash deploy/scripts/test-gcphcp-defaults.sh
