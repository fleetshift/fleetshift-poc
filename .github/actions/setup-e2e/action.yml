name: Set up FleetShift E2E
description: |
  Prepares a GitHub Actions job to use the AIO image built from this checkout.

  Three jobs share this action and must not race the image cache. `aio-image`
  is the only writer (`aio-mode: build`). `e2e-ui` and `e2e-backend` restore
  the same multi-image tar (`load` / `warm`) after `needs: aio-image`. They
  do not share a running container.

  The tar is `localhost/fleetshift-server`, `localhost/fleetshift-server-local`,
  `localhost/fleetshift-web`, and `quay.io/stolostron/fleetshift:latest`. The
  cache key is `aio-images-v2-<os>-<arch>-<git tree OID>`. On a miss, `build`
  also uploads a 1-day artifact so dependent jobs can download if same-run
  cache restore does not see the new key yet.

  Go (from `server/go.mod`), Node 24, and Playwright Chromium follow from
  `aio-mode`. Do not install those in the workflow.

inputs:
  aio-mode:
    description: |
      Which job is calling this action. Toolchain and image steps follow from
      the value; there are no separate go/playwright inputs.

      build — `aio-image` job, cache writer. Restore the tar. On a miss: install
      Go and Node, run `npx nx run fleetshift-poc:image:aio`, save the four
      tags, write the cache, upload the artifact. On a hit: restore the tar and
      stop (no Node, Go, or Playwright). Never podman-runs FleetShift.

      load — `e2e-ui` job, UI consumer. Restore (or download) the tar, podman
      load, install Node and Playwright. Do not run nx image:aio; the UI tests
      use the baked-in image. The workflow starts the Kind-capable sandbox
      after this action.

      warm — `e2e-backend` job, backend consumer. Same load as UI, then run
      nx image:aio once so TestMain's mandatory from-source build is a Podman
      layer-cache hit in this VM. Installs Go, Node, and Playwright (Dex
      form-fill). Tests still start their own AIO; they do not reuse the UI
      sandbox.
    required: true

runs:
  using: composite
  steps:
    # Hash the git tree so any tracked file that changes the image (or might)
    # busts the cache. OS/arch so an amd64 runner never loads an arm64 tar.
    - name: Compute AIO cache key
      id: aio-key
      shell: bash
      run: |
        echo "key=aio-images-v2-${{ runner.os }}-${{ runner.arch }}-$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

    - name: Restore AIO images
      id: aio-image-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/aio-images.tar
        key: ${{ steps.aio-key.outputs.key }}

    # server/go.mod is the repo toolchain pin (same file CodeQL uses).
    # image:aio dependsOn server:build; backend tests use the same 1.25.x.
    - name: Set up Go
      if: ${{ inputs.aio-mode == 'warm' || (inputs.aio-mode == 'build' && steps.aio-image-cache.outputs.cache-hit != 'true') }}
      uses: actions/setup-go@v6
      with:
        go-version-file: server/go.mod
        cache-dependency-path: "**/go.sum"

    # Node is required for nx image:aio (build miss / warm) and for Playwright.
    # The image job skips this entirely on a tar cache hit.
    - name: Set up Node
      if: ${{ inputs.aio-mode != 'build' || steps.aio-image-cache.outputs.cache-hit != 'true' }}
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    - name: Install npm dependencies
      if: ${{ inputs.aio-mode != 'build' || steps.aio-image-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: npm ci

    - name: Resolve Playwright version
      if: ${{ inputs.aio-mode != 'build' }}
      id: pw
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      if: ${{ inputs.aio-mode != 'build' }}
      id: pw-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

    - name: Install Playwright browsers
      if: ${{ inputs.aio-mode != 'build' }}
      shell: bash
      run: |
        if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
          npx playwright install-deps chromium
        else
          npx playwright install --with-deps chromium
        fi

    - name: Build all-in-one image
      if: ${{ inputs.aio-mode == 'build' && steps.aio-image-cache.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        NX_DAEMON: "false"
      run: |
        set -euo pipefail
        touch .env
        echo "cache miss: building AIO image"
        npx nx run fleetshift-poc:image:aio

        required=(
          localhost/fleetshift-server:latest
          localhost/fleetshift-server-local:latest
          localhost/fleetshift-web:latest
          quay.io/stolostron/fleetshift:latest
        )
        for img in "${required[@]}"; do
          if ! podman image exists "$img"; then
            echo "missing required image after build: $img" >&2
            podman images
            exit 1
          fi
        done

        extra=(
          quay.io/stolostron/fleetshift-server:latest
          quay.io/stolostron/fleetshift-server-local:latest
          quay.io/stolostron/fleetshift-web:latest
        )
        save=("${required[@]}")
        for img in "${extra[@]}"; do
          if podman image exists "$img"; then
            save+=("$img")
          fi
        done

        echo "saving ${#save[@]} image tags to ${RUNNER_TEMP}/aio-images.tar"
        podman save -o "${RUNNER_TEMP}/aio-images.tar" "${save[@]}"
        ls -lh "${RUNNER_TEMP}/aio-images.tar"

    - name: Save AIO images
      if: ${{ inputs.aio-mode == 'build' && steps.aio-image-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/aio-images.tar
        key: ${{ steps.aio-image-cache.outputs.cache-primary-key }}

    # Same-run fallback: a cache key saved in aio-image is not always visible to
    # dependent jobs yet. Upload on miss so load/warm can download if restore missed.
    - name: Upload AIO images
      if: ${{ inputs.aio-mode == 'build' && steps.aio-image-cache.outputs.cache-hit != 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: aio-images
        path: ${{ runner.temp }}/aio-images.tar
        retention-days: 1
        if-no-files-found: error
        compression-level: 0

    - name: Download AIO images
      if: ${{ inputs.aio-mode != 'build' && steps.aio-image-cache.outputs.cache-hit != 'true' }}
      uses: actions/download-artifact@v7
      with:
        name: aio-images
        path: ${{ runner.temp }}

    - name: Load AIO images
      if: ${{ inputs.aio-mode == 'load' || inputs.aio-mode == 'warm' }}
      shell: bash
      run: |
        set -euo pipefail
        tar="${RUNNER_TEMP}/aio-images.tar"
        if [ ! -f "$tar" ]; then
          echo "AIO image tar missing; the aio-image job should have populated the cache" >&2
          exit 1
        fi
        echo "loading AIO images from cache"
        podman load -i "$tar"
        required=(
          localhost/fleetshift-server:latest
          localhost/fleetshift-server-local:latest
          localhost/fleetshift-web:latest
          quay.io/stolostron/fleetshift:latest
        )
        for img in "${required[@]}"; do
          if ! podman image exists "$img"; then
            echo "tar did not contain $img" >&2
            podman images
            exit 1
          fi
        done

    # Backend TestMain always runs nx image:aio. This warm makes that second
    # invocation a Podman layer-cache hit in the same VM.
    - name: Warm all-in-one image
      if: ${{ inputs.aio-mode == 'warm' }}
      shell: bash
      env:
        NX_DAEMON: "false"
      run: |
        set -euo pipefail
        touch .env
        echo "warming AIO image (npx nx run fleetshift-poc:image:aio)"
        npx nx run fleetshift-poc:image:aio
