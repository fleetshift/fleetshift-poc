name: Set up FleetShift E2E
description: |
  Prepares a GitHub Actions job to use the AIO image built from this checkout.

  Two roles share one tree-keyed tar and must not race the cache. `aio-image`
  is the only writer (`role: cache`). The `e2e-playwright` matrix uses
  `role: e2e` after `needs: aio-image`. Matrix entries do not share a running
  container.

  The tar is `localhost/fleetshift-server`, `localhost/fleetshift-server-local`,
  `localhost/fleetshift-web`, and `quay.io/stolostron/fleetshift:latest`. Save
  uses `podman save --multi-image-archive` so those names are four images, not
  extra tags on the first. On a miss, `cache` also uploads a 1-day artifact so
  `e2e` jobs can download if same-run cache restore does not see the new key
  yet.

  Go (from `server/go.mod`), Node 24, and Playwright Chromium follow from
  `role`. Do not install those in the workflow.

  `e2e` also starts the user `podman.socket` and ensures the `kind` network
  exists. Each test job still uses a separate AIO container.

inputs:
  role:
    description: |
      Which job is calling this action. Toolchain and image steps follow from
      the value; there are no separate go/playwright inputs.

      cache — `aio-image` job, cache writer. Restore the tar. On a miss: install
      Go and Node, run `npx nx run image:aio`, save the four
      tags, write the cache, upload the artifact. On a hit: restore the tar and
      stop (no Node, Go, or Playwright). Never podman-runs FleetShift.

      e2e — the `e2e-playwright` matrix. Restore (or download) the tar, podman
      load, install Go, Node, and Playwright, start user podman.socket and
      ensure the kind network. Set FLEETSHIFT_E2E_AIO_PREBUILT=1 when invoking
      the UI and CLI targets so their shared Node runner does not rebuild the
      restored image. Go is required so the CLI suite can build fleetctl.
    required: true

runs:
  using: composite
  steps:
    # Hash the git tree so any tracked file that changes the image (or might)
    # busts the cache. OS/arch so an amd64 runner never loads an arm64 tar.
    - name: Compute AIO cache key
      id: aio-key
      shell: bash
      run: |
        echo "key=aio-images-v3-${{ runner.os }}-${{ runner.arch }}-$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

    - name: Restore AIO images
      id: aio-image-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/aio-images.tar
        key: ${{ steps.aio-key.outputs.key }}

    - name: Set up Go
      if: ${{ inputs.role == 'e2e' }}
      uses: actions/setup-go@v6
      with:
        go-version-file: server/go.mod
        cache-dependency-path: "**/go.sum"

    # Node is required for nx (image:aio on cache miss, test:e2e) and Playwright.
    # The cache job skips this entirely on a tar cache hit.
    - name: Set up Node
      if: ${{ inputs.role == 'e2e' || (inputs.role == 'cache' && steps.aio-image-cache.outputs.cache-hit != 'true') }}
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    - name: Install npm dependencies
      if: ${{ inputs.role == 'e2e' || (inputs.role == 'cache' && steps.aio-image-cache.outputs.cache-hit != 'true') }}
      shell: bash
      run: npm ci

    - name: Resolve Playwright version
      if: ${{ inputs.role == 'e2e' }}
      id: pw
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      if: ${{ inputs.role == 'e2e' }}
      id: pw-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

    - name: Install Playwright browsers
      if: ${{ inputs.role == 'e2e' }}
      shell: bash
      run: |
        if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
          npx playwright install-deps chromium
        else
          npx playwright install --with-deps chromium
        fi

    - name: Build all-in-one image
      if: ${{ inputs.role == 'cache' && steps.aio-image-cache.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        NX_DAEMON: "false"
      run: |
        set -euo pipefail
        echo "cache miss: building AIO image"
        npx nx run image:aio

        required=(
          localhost/fleetshift-server:latest
          localhost/fleetshift-server-local:latest
          localhost/fleetshift-web:latest
          quay.io/stolostron/fleetshift:latest
        )
        for img in "${required[@]}"; do
          if ! podman image exists "$img"; then
            echo "missing required image after build: $img" >&2
            podman images
            exit 1
          fi
        done

        # Four distinct images. Without -m, extra tags collapse onto the first.
        echo "saving ${#required[@]} images to ${RUNNER_TEMP}/aio-images.tar"
        podman save --multi-image-archive -o "${RUNNER_TEMP}/aio-images.tar" "${required[@]}"
        ls -lh "${RUNNER_TEMP}/aio-images.tar"

    - name: Save AIO images
      if: ${{ inputs.role == 'cache' && steps.aio-image-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/aio-images.tar
        key: ${{ steps.aio-image-cache.outputs.cache-primary-key }}

    # Same-run fallback: a cache key saved in aio-image is not always visible to
    # dependent jobs yet. Upload on miss so e2e can download if restore missed.
    - name: Upload AIO images
      if: ${{ inputs.role == 'cache' && steps.aio-image-cache.outputs.cache-hit != 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: aio-images
        path: ${{ runner.temp }}/aio-images.tar
        retention-days: 1
        if-no-files-found: error
        compression-level: 0

    - name: Download AIO images
      if: ${{ inputs.role == 'e2e' && steps.aio-image-cache.outputs.cache-hit != 'true' }}
      uses: actions/download-artifact@v7
      with:
        name: aio-images
        path: ${{ runner.temp }}

    - name: Load AIO images
      if: ${{ inputs.role == 'e2e' }}
      shell: bash
      run: |
        set -euo pipefail
        tar="${RUNNER_TEMP}/aio-images.tar"
        if [ ! -f "$tar" ]; then
          echo "AIO image tar missing; the aio-image job should have populated the cache" >&2
          exit 1
        fi
        echo "loading AIO images from cache"
        podman load -i "$tar"
        required=(
          localhost/fleetshift-server:latest
          localhost/fleetshift-server-local:latest
          localhost/fleetshift-web:latest
          quay.io/stolostron/fleetshift:latest
        )
        for img in "${required[@]}"; do
          if ! podman image exists "$img"; then
            echo "tar did not contain $img" >&2
            podman images
            exit 1
          fi
        done
        aio_id="$(podman image inspect -f '{{.Id}}' quay.io/stolostron/fleetshift:latest)"
        server_id="$(podman image inspect -f '{{.Id}}' localhost/fleetshift-server:latest)"
        if [ "$aio_id" = "$server_id" ]; then
          echo "quay.io/stolostron/fleetshift:latest is the server image, not AIO (need podman save --multi-image-archive)" >&2
          exit 1
        fi

    # User podman.socket plus kind network. Shared by UI and CLI so Kind
    # docker-out-of-docker uses the same host recipe as local Linux.
    - name: Prepare Kind host
      if: ${{ inputs.role == 'e2e' }}
      shell: bash
      run: node "${{ github.action_path }}/kind-host.mjs"
